name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Manual run (Actions > CI > Run workflow). Runs `test` and the `snyk` gate so the gate can be exercised without
  # tagging a release. It can never publish: `publish` and `docs` still require a tag push / a push to main.
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# Runner image is pinned (ubuntu-24.04) instead of `ubuntu-latest`: GitHub is migrating the `latest` label to Ubuntu 26,
# which would change the toolchain under us without a commit. Move to a newer image deliberately, after testing.
jobs:
  # ---------------------------------------------------------------- test
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]   # previous LTS (bytecode baseline) and current LTS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  # ---------------------------------------------------------------- docs
  # Publishes README + Swagger UI (OpenAPI v3) + Javadoc to GitHub Pages. Needs no secrets.
  # Two jobs on purpose. `docs-build` runs the npm and Maven tooling, which is third-party code, with a read-only token
  # and no OIDC identity. Only `docs` holds the Pages permissions, and it runs no build tooling: it just deploys the
  # artifact that `docs-build` uploaded. A compromised build dependency therefore cannot deploy to Pages by itself.
  docs-build:
    name: Build docs
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Javadoc is generated with Maven
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Lint spec, generate Javadoc and build site
        run: ./docs/build-site.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  docs:
    name: Publish docs
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write       # deploy to GitHub Pages
      id-token: write    # OIDC token that actions/deploy-pages verifies
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # --------------------------------------------------------------- snyk
  # Release gate. Runs for version tags (and on a manual run), in parallel with `test`, and `publish` needs it. It blocks the
  # release when:
  #   - a dependency has a finding of MEDIUM severity or higher (medium, high, critical) that HAS A FIX, meaning
  #     a fixed version has been published (Snyk's `fixedIn`). Findings with no published fix are listed but do
  #     not block, and low-severity findings never block; or
  #   - Snyk Code reports a finding of medium severity or higher in the source (a fix is always possible there).
  # Why not `snyk test --fail-on=all`? It only counts issues Snyk can remediate by upgrading a direct dependency, so
  # it let critical transitive issues with published fixes pass (verified), which are exactly the ones fixed here
  # with a version override. To accept a finding deliberately, fix it or record a documented ignore in a `.snyk`
  # policy file (see CONTRIBUTORS.md).
  # Needs the SNYK_TOKEN repository secret. A missing token FAILS the job, so the gate cannot be skipped silently.
  snyk:
    name: Snyk security gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Snyk resolves the Maven dependency tree with mvn
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The Snyk CLI is installed from ci/snyk/package-lock.json, not fetched with `npx`: `npm ci` checks every package,
      # transitive ones included, against the integrity hashes in the lockfile, and --ignore-scripts runs no install
      # script. This job runs with SNYK_TOKEN, so nothing unpinned may run in it. The CLI version is in
      # ci/snyk/package.json; Dependabot bumps it with the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Snyk CLI from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ci/snyk
      - name: Require SNYK_TOKEN
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::The SNYK_TOKEN secret is not set. The Snyk release gate cannot run, so nothing will be published."
            exit 1
          fi
      - name: Snyk Open Source scan (dependencies of every module)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # Exit codes: 0 = clean, 1 = vulnerabilities found (judged in the next step), anything else = Snyk
          # itself failed, which must fail the job (fail closed) and not be mistaken for a clean scan.
          status=0
          "$GITHUB_WORKSPACE/ci/snyk/node_modules/.bin/snyk" test --all-projects --severity-threshold=medium --json > snyk-oss.json || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error::Snyk exited with status $status; the scan did not complete, so nothing will be published."
            head -c 2000 snyk-oss.json
            exit 1
          fi
      - name: Block on dependency findings that have a fix
        run: |
          # Any project Snyk could not scan is a failure, not a pass.
          if jq -e '(if type == "array" then . else [.] end) | any(.[]; has("error"))' snyk-oss.json > /dev/null; then
            echo "::error::Snyk could not scan one or more projects:"
            jq -r '(if type == "array" then . else [.] end)[] | select(has("error")) | "  " + .error' snyk-oss.json
            exit 1
          fi
          # Unique medium-or-higher findings across all modules, each with the versions that fix it.
          cat > gate.jq <<'EOF'
          (if type == "array" then . else [.] end)
          | map((.vulnerabilities // [])[])
          | map(select(.severity == "medium" or .severity == "high" or .severity == "critical"))
          | unique_by(.id + "|" + .packageName + "|" + .version)
          | map({sev: .severity, pkg: (.packageName + "@" + .version), title: .title, id: .id, fixedIn: (.fixedIn // [])})
          EOF
          fixable=$(jq -r -f gate.jq snyk-oss.json | jq -r 'map(select(.fixedIn | length > 0))[] | "  [\(.sev)] \(.pkg): \(.title) (fixed in \(.fixedIn | join(", "))) \(.id)"')
          unfixable=$(jq -r -f gate.jq snyk-oss.json | jq -r 'map(select(.fixedIn | length == 0))[] | "  [\(.sev)] \(.pkg): \(.title) \(.id)"')
          if [ -n "$unfixable" ]; then
            echo "Findings with no published fix yet (reported, NOT blocking):"
            echo "$unfixable"
          fi
          if [ -n "$fixable" ]; then
            echo "::error::Dependency findings with an available fix (medium or higher) block the release:"
            echo "$fixable"
            exit 1
          fi
          echo "No dependency findings of medium severity or higher have an available fix."
      - name: Snyk Code (source)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: '"$GITHUB_WORKSPACE/ci/snyk/node_modules/.bin/snyk" code test --severity-threshold=medium'

  # ------------------------------------------------------------- publish
  # Runs only for version tags (v1.2.3), after the tests AND the Snyk gate pass on the same commit.
  # The tag is the version of record: the POM version is set from it at build time.
  publish:
    name: Publish to Maven Central
    needs: [test, snyk]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Secrets live in this GitHub Environment (Settings > Environments). Add required reviewers
    # there to gate every release behind a manual approval.
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25   # current LTS; bytecode is still released for Java 21 (java.version in pom.xml)
          cache: maven
          # setup-java writes settings.xml with a `central` server whose credentials are read from
          # these environment variables at run time -- nothing is stored in the file or the repo.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          # Imports the signing key into the runner's keyring; passphrase is read from the env var.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ./mvnw --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="$version" -DgenerateBackupPoms=false
      - name: Sign, upload and validate (a maintainer then clicks Publish in the Central Portal)
        # Tests already passed in the `test` job for this commit, so they are skipped here.
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
