# Dependabot opens pull requests for outdated or vulnerable dependencies and for GitHub Actions versions.
# Commit titles follow the Conventional Commits style used in this repo (see CONTRIBUTORS.md).
#
# Not covered: the version overrides in the parent pom.xml's <properties> (logback.version). They are BOM properties, not dependency versions, so review them by hand when Spring Boot is updated.
version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/spring-boot-business-rules"
      - "/example"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The tools that build the docs site; Dependabot updates package.json and package-lock.json together.
  - package-ecosystem: "npm"
    directory: "/docs/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      docs-tools:
        patterns:
          - "*"

  # The Snyk CLI that runs the release gate (with SNYK_TOKEN); package.json and package-lock.json move together.
  - package-ecosystem: "npm"
    directory: "/ci/snyk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
